# Brings up the main app container only. Qdrant is NOT included as a
# service here -- this project uses Qdrant CLOUD (free tier), not a
# self-hosted instance (see FINDINGS.md: "Vector DB: Qdrant Cloud, not
# local Docker"). QDRANT_URL and QDRANT_API_KEY are passed through from
# your .env file at the project root (copy .env.example to .env and fill
# in real values -- see that file for the exact keys expected).

services:
  api:
    build: .
    command: ["python", "-m", "app.api.main"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/processed:/app/data/processed
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ui:
    build: .
    command: ["python", "-m", "streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data/processed:/app/data/processed
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - api
